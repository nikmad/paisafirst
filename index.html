<!DOCTYPE html>
<html>

<head>
  <title>PaisaFirst</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
  </script>

 <style>
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #0f172a;
    color: #e2e8f0;
  }

  /* MAIN GRID */
  .dashboard {
    display: grid;
    grid-template-columns: 260px 1fr 320px;
    height: 100vh;
  }

  /* LEFT PANEL */
  .left-panel {
    background: #1e293b;
    padding: 20px;
    border-right: 1px solid #334155;

    position: sticky;
    top: 0;
    height: 100vh;
  }


  /* CENTER PANEL (SCROLLABLE TABLE) */
  .center-panel {
    overflow-y: auto;
    padding: 20px;
  }

.top-bar {
  backdrop-filter: blur(10px);
  position: sticky;
  top: 0;
  z-index: 20;

  display: flex;
  align-items: center;
  gap: 10px;   /* reduced */

  padding: 10px 15px;  /* reduced height */
  background: #020617;
  border-bottom: 1px solid #334155;
}

/* center alignment */
.upload-wrapper {
  flex: 1;
  max-width: calc(100% - 120px);  /* leave space for button */
}

/* upload box full width */
.upload-box {
  width: 70%;
  padding: 14px;

  background: #020617;
  border: 2px dashed #334155;
  border-radius: 10px;

  color: #94a3b8;
  text-align: center;
  cursor: pointer;

  transition: all 0.2s;
}

.upload-box:hover {
  border-color: #22c55e;
  color: #e2e8f0;
}

.upload-box.active {
  border-color: #22c55e;
  color: #4ade80;
}

  /* RIGHT PANEL */
  .right-panel {
    background: #1e293b;
    padding: 20px;
    border-left: 1px solid #334155;

    position: sticky;
    top: 0;
    height: 100vh;
  }

  /* BUTTONS */
  button {
    padding: 10px;
    margin-top: 10px;
    width: 100%;
    background: #22c55e;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }

  /* TOTAL */
  #total {
    margin-top: 15px;
    color: #4ade80;
  }

  /* CHART BOX */
  .chart-box {
    background: #0f172a;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
  }

.analyze-btn {
  flex-shrink: 0;     /* prevents shrinking */
  width: 80px;       /* fixed clean width */
  padding: 10px;
  margin-top: 0;
}

  /* TABLE */
table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
}

/* Make table scroll correctly */
.center-panel {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

.table-wrapper {
  overflow-y: auto;
  flex: 1;
  padding: 20px;
}

.upload-box {
  width: 100%;
  padding: 16px;
  margin-top: 0;

  background: #020617;
  border: 2px dashed #334155;
  border-radius: 10px;

  color: #94a3b8;
  text-align: center;
  cursor: pointer;

  transition: all 0.2s ease;
}

.upload-box:hover {
  border-color: #22c55e;
  background: #020617;
  color: #e2e8f0;
}

/* when file selected */
.upload-box.active {
  border-color: #22c55e;
  color: #4ade80;
}

/* THEAD sticky */
thead th {
  position: sticky;
  top: 0;
  z-index: 10;

  background: linear-gradient(90deg, #facc15, #fde047);
  color: #0f172a;

  padding: 12px;
  font-weight: 700;

  border-bottom: 2px solid #eab308;
}

/* BODY */
tbody td {
  padding: 12px;
}

/* 🔥 ALTERNATING COLORS */
tr:nth-child(even) {
  background: #0f172a;   /* deep navy */
}

tr:nth-child(odd) {
  background: #1e293b;   /* deep grey-blue */
}

/* ✨ HOVER EFFECT */
tr:hover {
  background: #334155;
  transition: 0.2s;
}

/* ROUND CORNERS */
tr:first-child th:first-child {
  border-top-left-radius: 10px;
}

tr:first-child th:last-child {
  border-top-right-radius: 10px;
}

  /* DROPDOWN */
  select {
    background: #0f172a;
    color: white;
    border: 1px solid #475569;
    padding: 5px;
    border-radius: 5px;
  }

</style>
</head>

<body>

  <div class="dashboard">

  <!-- LEFT -->
<div class="left-panel">
  <h1>💰 PaisaFirst</h1>
  <p>Your personal expense intelligence</p>

  <h3 id="total"></h3>

  <button onclick="toggleTable()">📄 Show Statement</button>
</div>

  <!-- CENTER -->
  <div class="center-panel">

    <!-- TOP BAR -->
    <div class="top-bar">
      <div class="upload-wrapper">
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
          <span id="uploadText">📂 Upload your GPay PDF</span>
        </div>

        <input type="file" id="fileInput" style="display:none" onchange="handleFileSelect(event)">
      </div>

      <button class="analyze-btn" onclick="processPDF()">Analyze</button>
    </div>

    <!-- TABLE -->
    <div class="table-wrapper">
      <div id="tableContainer"></div>
    </div>

  </div>

  <!-- RIGHT -->
  <div class="right-panel">
    <div class="chart-box">
      <h3>Category</h3>
      <canvas id="categoryChart"></canvas>
    </div>

    <div class="chart-box">
      <h3>Bank</h3>
      <canvas id="bankChart"></canvas>
    </div>
  </div>

</div>

<script>
let transactions = [];
let categoryChart;
let bankChart;
let merchantMap = JSON.parse(localStorage.getItem("merchantMap")) || {};

// Categorization logic
function categorize(text) {

  let key = normalizeMerchant(text);

  // ✅ Your rule (NOW WORKS)
  if (key.includes("fancy") || key.includes("womens")) {
    return "Fashion";
  }

  if (key.includes("mc donald") || key.includes("chicken") || key.includes("fruits") || key.includes("bigbasket")) return "Food";
  if (key.includes("uber") || key.includes("ola") || key.includes("hpcl")) return "Transport";
  if (key.includes("power") || key.includes("water")) return "Bills";

    // THEN fallback to user mapping
  if (merchantMap[key]) {
    return merchantMap[key];
  }

  return "Others";
}

function normalizeMerchant(name) {
  return name
    .toLowerCase()
    .replace(/[^a-z ]/g, "")   // remove symbols
    .replace(/\s+/g, " ")
    .trim();
}

// Process uploaded PDF
async function processPDF() {
  const file = document.getElementById("fileInput").files[0];

  if (!file) {
    alert("Please upload a PDF");
    return;
  }

  const reader = new FileReader();

  reader.onload = async function() {
    const typedarray = new Uint8Array(reader.result);

    const pdf = await pdfjsLib.getDocument(typedarray).promise;

    let fullText = "";

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const textContent = await page.getTextContent();
      const pageText = textContent.items.map(item => item.str).join(" ");
      fullText += pageText + "\n";
    }

    parseText(fullText);
  };

  reader.readAsArrayBuffer(file);
}

// Parse extracted text
function parseText(text) {

  // RESET transactions
  transactions = [];

  let categories = {};
  let banks = {};
  let total = 0;

  let txList = text.split(/Paid to /i);

  for (let tx of txList) {

    if (!tx.includes("₹")) continue;

    // Extract merchant
    let merchant = tx.split("UPI")[0].trim();

    // Extract amount
    let amountMatch = tx.match(/₹([\d,\.]+)/);
    if (!amountMatch) continue;

    let amount = parseFloat(amountMatch[1].replace(/,/g, ""));
    if (isNaN(amount)) continue;

    // Extract bank
    let bankMatch = tx.match(/Paid by (.*?)(₹|\n)/i);
    let bank = "Other";

    if (bankMatch) {
      let bankText = bankMatch[1].toLowerCase();

      if (bankText.includes("standard chartered")) bank = "Standard Chartered";
      else if (bankText.includes("axis")) bank = "Axis Bank";
      else if (bankText.includes("state bank")) bank = "SBI";
      else if (bankText.includes("bank of india")) bank = "BOI";
    }

    // Skip self transfer
    if (merchant.toLowerCase().includes("self transfer")) continue;

    let category = categorize(merchant);

    // ✅ Store transaction (CORRECT PLACE)
    transactions.push({
      date: extractDate(tx),
      time: extractTime(tx),
      merchant: merchant,
      amount: amount,
      bank: bank,
      category: category
    });

    // Category aggregation
    if (!categories[category]) categories[category] = 0;
    categories[category] += amount;

    // Bank aggregation
    if (!banks[bank]) banks[bank] = 0;
    banks[bank] += amount;

    total += amount;
  }

  document.getElementById("total").innerText =
    "Total Spend: ₹" + total.toFixed(2);

  drawCategoryChart(categories);
  drawBankChart(banks);
}


// Draw bank pie chart
function drawBankChart(data) {
  const ctx = document.getElementById("bankChart");

  if (bankChart) bankChart.destroy();

  bankChart = new Chart(ctx, {
    type: 'pie',
    data: {
      labels: Object.keys(data),
      datasets: [{
        data: Object.values(data)
      }]
    },
    options: {
      plugins: {
        legend: {
          labels: {
            color: "#ffffff"
          }
        },
        tooltip: {
          backgroundColor: "#020617",
          titleColor: "#ffffff",
          bodyColor: "#e2e8f0",
          borderColor: "#334155",
          borderWidth: 1,
          callbacks: {
            label: function(context) {
              let value = context.raw;
              let total = context.dataset.data.reduce((a, b) => a + b, 0);
              let percent = ((value / total) * 100).toFixed(1);

              return `${context.label}: ₹${value} (${percent}%)`;
            }
          }
        }
      }
    }
  });
}

function extractDate(text) {
  let match = text.match(/\d{2} \w{3}, \d{4}/);
  return match ? match[0] : "";
}

function extractTime(text) {
  let match = text.match(/\d{2}:\d{2} (AM|PM)/);
  return match ? match[0] : "";
}

function toggleTable() {
  renderTable();
}

function renderTable() {

  let html = `
  <table border="1" style="width:100%; border-collapse:collapse;">
  <thead>
    <tr>
      <th>#</th>
      <th>Date</th>
      <th>Time</th>
      <th>Merchant</th>
      <th>Amount</th>
      <th>Bank</th>
      <th>Category</th>
    </tr>
  </thead>
  `;

  transactions.forEach((tx, index) => {
    html += `
      <tr>
        <td>${index + 1}</td>
        <td>${tx.date}</td>
        <td>${tx.time}</td>
        <td>${tx.merchant}</td>
        <td>₹${tx.amount}</td>
        <td>${tx.bank}</td>
        <td>
          <select onchange="updateCategory(${index}, this.value)">
            ${getCategoryOptions(tx.category)}
          </select>
        </td>
      </tr>
    `;
  });

  html += "</table>";

  document.getElementById("tableContainer").innerHTML = html;
}

function getCategoryOptions(selected) {

  const categories = [
    "Food",
    "Groceries",
    "Transport",
    "Bills",
    "Rent",
    "Shopping",
    "Health",
    "Entertainment",
    "Fuel",
    "Fashion",
    "Others"
  ];

  return categories.map(cat =>
    `<option value="${cat}" ${cat === selected ? "selected" : ""}>${cat}</option>`
  ).join("");
}

function updateCategory(index, newCategory) {

  let merchant = transactions[index].merchant.toLowerCase().trim();

  // ✅ Save mapping
  merchantMap[merchant] = newCategory;

  // Save to browser
  localStorage.setItem("merchantMap", JSON.stringify(merchantMap));

  // ✅ Update ALL transactions of same merchant
  transactions.forEach(tx => {
    if (tx.merchant.toLowerCase().trim() === merchant) {
      tx.category = newCategory;
    }
  });

  // Refresh everything
  recalculateCharts();
  renderTable();
}

function recalculateCharts() {

  let categories = {};
  let banks = {};
  let total = 0;

  transactions.forEach(tx => {

    if (!categories[tx.category]) categories[tx.category] = 0;
    categories[tx.category] += tx.amount;

    if (!banks[tx.bank]) banks[tx.bank] = 0;
    banks[tx.bank] += tx.amount;

    total += tx.amount;
  });

  document.getElementById("total").innerText =
    "Total Spend: ₹" + total.toFixed(2);

  drawCategoryChart(categories);
  drawBankChart(banks);
}

function drawCategoryChart(data) {
  const ctx = document.getElementById("categoryChart");

  if (categoryChart) categoryChart.destroy();

  categoryChart = new Chart(ctx, {
    type: 'pie',
    data: {
      labels: Object.keys(data),
      datasets: [{
        data: Object.values(data)
      }]
    },
    options: {
      plugins: {
        legend: {
          labels: {
            color: "#ffffff"
          }
        },
        tooltip: {
          callbacks: {
            label: function(context) {
              let value = context.raw;
              let total = context.dataset.data.reduce((a, b) => a + b, 0);
              let percent = ((value / total) * 100).toFixed(1);

              return `${context.label}: ₹${value} (${percent}%)`;
            }
          }
        }
      }
    }
  });
}

function handleFileSelect(event) {
  const file = event.target.files[0];

  if (file) {
    document.getElementById("uploadText").innerText = "✅ " + file.name;

    document.querySelector(".upload-box").classList.add("active");
  }
}

</script>

</body>
</html>
